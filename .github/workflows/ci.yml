# O que se confere a cada push e pull request.
#
# O binário que se distribui é CGO_ENABLED=0 (sem compilador C na máquina de
# quem usa) — então build e testes rodam assim nos três sistemas. O detector de
# corrida é a exceção: `-race` exige CGO, e roda num job à parte, só no Linux.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  teste:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  corrida:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  qualidade:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # Quem importa transcricao não pode herdar whatsmeow nem SQLite, e midia
      # não pode depender de transcricao: é o que deixa cada um reutilizável.
      - name: regras de dependência
        run: |
          fora=$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./transcricao/... \
            | grep -v -e '^$' -e '^github.com/kapstanhq/whatsapp-reader/transcricao' || true)
          test -z "$fora" || { echo "transcricao importa fora da biblioteca padrão:"; echo "$fora"; exit 1; }
          ! go list -deps ./midia/... | grep '^github.com/kapstanhq/whatsapp-reader/transcricao'
